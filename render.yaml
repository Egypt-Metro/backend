# render.yaml — Render Blueprint, tuned for the FREE plan (no card, no Redis).
# Deploy:  Render dashboard -> New -> Blueprint -> pick this repo.
# Database: external (Neon) via the DATABASE_URL you paste in the dashboard.
# Caveat:  a free web service sleeps after ~15 min idle (~40 s cold start).
# schema:  https://render.com/schema/render.yaml.json

services:
  - type: web
    name: metro-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip && \
      pip install -r requirements.txt && \
      python manage.py collectstatic --noinput
    # migrate + idempotent first-run seed (admin & data), then serve.
    # Single worker -> in-memory channel layer, no Redis needed.
    startCommand: |
      python manage.py migrate --noinput && \
      python manage.py bootstrap && \
      uvicorn metro.asgi:application --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: "/health/"
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: SECRET_KEY
        sync: false          # paste in the Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false          # Neon connection string (keep ?sslmode=require...)
      - key: BASE_URL
        sync: false          # https://<service>.onrender.com  (fill after 1st deploy)
      - key: ALLOWED_HOSTS
        sync: false          # <service>.onrender.com[,custom-domain]
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # frontend origin(s); leave blank for now
