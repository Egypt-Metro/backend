# render.yaml
# Render configuration file for deploying a Django application to Render
# schema: https://render.com/schema/render.yaml.json

services:
  - type: web
    name: django
    runtime: python
    buildCommand: |
      apt-get update && apt-get install -y gcc libpq-dev python3-dev && \
      pip install --upgrade pip && \
      pip install poetry && \
      poetry install --only main && \
      python manage.py collectstatic --noinput && \
      python manage.py migrate --noinput
    # ASGI server (uvicorn) so both HTTP and WebSockets (Django Channels) are served.
    startCommand: uvicorn metro.asgi:application --host 0.0.0.0 --port $PORT --workers 3 --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: REDIS_URL              # Channel layer backend for WebSocket broadcast
        fromService:
          type: redis
          name: metro-redis
          property: connectionString
      - key: ENVIRONMENT             # Environment for loading specific config
        value: prod
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: ALLOWED_HOSTS
        value: backend-54v5.onrender.com
      - key: DEBUG
        value: "False"
      - key: DEPLOYED_AT
        value: ${RENDER_DEPLOY_TIMESTAMP}
      - key: PYTHON_VERSION          # Specify the Python version
        value: "3.11.10"
    disk:
      name: uploads
      mountPath: /uploads
      sizeGB: 1
    healthCheckPath: "/health/"
    autoDeploy: true

  - type: redis
    name: metro-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []          # only reachable from services in this Render account
