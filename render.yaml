# render.yaml — FALLBACK host config (primary target is Koyeb; see DEPLOYMENT.md).
# Tuned for Render's FREE plan: no paid instance, no Redis service.
# Caveat: a free web service sleeps after ~15 min idle. Use Neon for the DB
# (Render's own free Postgres is deleted after 30-90 days).
# schema: https://render.com/schema/render.yaml.json

services:
  - type: web
    name: metro-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip && \
      pip install -r requirements.txt && \
      python manage.py collectstatic --noinput
    # Single worker -> in-memory channel layer, no Redis needed.
    startCommand: |
      python manage.py migrate --noinput && \
      uvicorn metro.asgi:application --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: "/health/"
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: SECRET_KEY
        sync: false          # set in the Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false          # Neon connection string (include ?sslmode=require)
      - key: BASE_URL
        sync: false          # https://<service>.onrender.com
      - key: ALLOWED_HOSTS
        sync: false          # <service>.onrender.com[,custom-domain]
      - key: CORS_ALLOWED_ORIGINS
        sync: false
